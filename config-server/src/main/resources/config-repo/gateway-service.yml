spring:
  cloud:
    loadbalancer:
      zone: HN
    gateway:
      server:
        webflux:
          routes:
            - id: organizer-service
              uri: lb://organizer-service
              predicates:
                - Path=/api/organizers/**
              filters:
                - StripPrefix=2

            - id: events-service
              uri: lb://events-service
              predicates:
                - Path=/api/events/**
              filters:
                - StripPrefix=2
server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    metadata-map:
      zone: HN
